<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Para Ti, Amorsito 🌻</title>
  
  <!-- Tipografías elegantes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      background: linear-gradient(135deg, #060c1a 0%, #0d1b3e 40%, #162a5b 100%);
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 15px;
      position: relative;
    }

    /* Canvas para la lluvia interactiva de flores y pétalos */
    #flowerCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
    }

    /* Tarjeta principal estilo nota en amarillo cálido vibrante */
    .note-card {
      background: linear-gradient(145deg, #fef08a 0%, #facc15 100%);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 
                  0 0 30px rgba(250, 204, 21, 0.25);
      width: 100%;
      max-width: 440px;
      padding: 32px 26px 28px;
      text-align: center;
      position: relative;
      z-index: 2;
      border: 2px solid rgba(255, 255, 255, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Fecha/Detalle superior */
    .date-badge {
      background-color: rgba(113, 63, 18, 0.12);
      color: #713f12;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 6px 16px;
      border-radius: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Título principal */
    .title {
      font-family: 'Dancing Script', cursive;
      font-size: 2.8rem;
      color: #422006;
      line-height: 1.1;
      text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.5);
    }

    /* Ilustración SVG de Flores Amarillas */
    .flower-wrapper {
      width: 140px;
      height: 140px;
      margin: 4px 0;
      filter: drop-shadow(0 10px 15px rgba(113, 63, 18, 0.2));
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .flower-wrapper:active {
      transform: scale(0.92) rotate(-5deg);
    }

    /* Primer botón interactivo justo bajo las flores */
    .btn-flower {
      background: linear-gradient(135deg, #ca8a04 0%, #854d0e 100%);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(133, 77, 14, 0.3);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-flower:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(133, 77, 14, 0.4);
    }

    .btn-flower:active {
      transform: scale(0.95);
    }

    /* Mensaje Romántico Principal */
    .message {
      font-family: 'Caveat', cursive;
      font-size: 1.75rem;
      color: #422006;
      line-height: 1.4;
      font-weight: 700;
      margin: 6px 0;
      padding: 0 8px;
    }

    /* Segundo botón interactivo en la parte inferior */
    .btn-more {
      background: #713f12;
      color: #fef08a;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(66, 32, 6, 0.25);
      transition: all 0.2s ease;
      margin-top: 4px;
    }

    .btn-more:hover {
      background: #542d0c;
      transform: translateY(-2px);
    }

    .btn-more:active {
      transform: scale(0.95);
    }

    /* Firma Eduardo G en la parte inferior derecha */
    .signature-container {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
      padding-right: 6px;
    }

    .signature {
      font-family: 'Dancing Script', cursive;
      font-size: 1.8rem;
      font-weight: 700;
      color: #713f12;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Canvas animado -->
  <canvas id="flowerCanvas"></canvas>

  <!-- Tarjeta de nota en amarillo -->
  <main class="note-card">
    <div class="date-badge">21 de Septiembre 💛</div>
    
    <h1 class="title">Para Ti, Amorsito</h1>

    <!-- Ilustración de Flores Amarillas -->
    <div class="flower-wrapper" id="centerFlower" title="¡Haz clic en las flores!">
      <svg viewBox="0 0 200 200" width="100%" height="100%">
        <!-- Hojas y Tallo -->
        <path d="M100,120 Q80,150 50,165 Q85,175 100,140" fill="#65a30d"/>
        <path d="M100,120 Q120,150 150,165 Q115,175 100,140" fill="#4d7c0f"/>
        <path d="M96,100 L96,185 C96,188 104,188 104,185 L104,100 Z" fill="#3f6212"/>

        <!-- Girasol Principal Central -->
        <g transform="translate(100,85)">
          <!-- Pétalos -->
          <path d="M0,-45 C-8,-25 8,-25 0,-5" fill="#facc15" transform="rotate(0)"/>
          <path d="M0,-45 C-8,-25 8,-25 0,-5" fill="#eab308" transform="rotate(30)"/>
          <path d="M0,-45 C-8,-25 8,-25 0,-5" fill="#facc15" transform="rotate(60)"/>
          <path d="M0,-45 C-8,-25 8,-25 0,-5" fill="#eab308" transform="rotate(90)"/>
          <path d="M0,-45 C-8,-25 8,-25 0,-5" fill="#facc15" transform="rotate(120)"/>
          <path d="M0,-45 C-8,-25 8,-25 0,-5" fill="#eab308" transform="rotate(150)"/>
          <path d="M0,-45 C-8,-25 8,-25 0,-5" fill="#facc15" transform="rotate(180)"/>
          <path d="M0,-45 C-8,-25 8,-25 0,-5" fill="#eab308" transform="rotate(210)"/>
          <path d="M0,-45 C-8,-25 8,-25 0,-5" fill="#facc15" transform="rotate(240)"/>
          <path d="M0,-45 C-8,-25 8,-25 0,-5" fill="#eab308" transform="rotate(270)"/>
          <path d="M0,-45 C-8,-25 8,-25 0,-5" fill="#facc15" transform="rotate(300)"/>
          <path d="M0,-45 C-8,-25 8,-25 0,-5" fill="#eab308" transform="rotate(330)"/>

          <!-- Centro del Girasol -->
          <circle cx="0" cy="0" r="18" fill="#713f12"/>
          <circle cx="0" cy="0" r="14" fill="#422006"/>
          <circle cx="-4" cy="-4" r="3" fill="#a16207" opacity="0.6"/>
        </g>

        <!-- Flores Secundarias -->
        <g transform="translate(60,105) scale(0.65)">
          <circle cx="0" cy="0" r="10" fill="#713f12"/>
          <path d="M0,-28 C-6,-15 6,-15 0,0" fill="#fde047" transform="rotate(0)"/>
          <path d="M0,-28 C-6,-15 6,-15 0,0" fill="#fde047" transform="rotate(45)"/>
          <path d="M0,-28 C-6,-15 6,-15 0,0" fill="#fde047" transform="rotate(90)"/>
          <path d="M0,-28 C-6,-15 6,-15 0,0" fill="#fde047" transform="rotate(135)"/>
          <path d="M0,-28 C-6,-15 6,-15 0,0" fill="#fde047" transform="rotate(180)"/>
          <path d="M0,-28 C-6,-15 6,-15 0,0" fill="#fde047" transform="rotate(225)"/>
          <path d="M0,-28 C-6,-15 6,-15 0,0" fill="#fde047" transform="rotate(270)"/>
          <path d="M0,-28 C-6,-15 6,-15 0,0" fill="#fde047" transform="rotate(315)"/>
        </g>

        <g transform="translate(140,105) scale(0.65)">
          <circle cx="0" cy="0" r="10" fill="#713f12"/>
          <path d="M0,-28 C-6,-15 6,-15 0,0" fill="#fde047" transform="rotate(20)"/>
          <path d="M0,-28 C-6,-15 6,-15 0,0" fill="#fde047" transform="rotate(65)"/>
          <path d="M0,-28 C-6,-15 6,-15 0,0" fill="#fde047" transform="rotate(110)"/>
          <path d="M0,-28 C-6,-15 6,-15 0,0" fill="#fde047" transform="rotate(155)"/>
          <path d="M0,-28 C-6,-15 6,-15 0,0" fill="#fde047" transform="rotate(200)"/>
          <path d="M0,-28 C-6,-15 6,-15 0,0" fill="#fde047" transform="rotate(245)"/>
          <path d="M0,-28 C-6,-15 6,-15 0,0" fill="#fde047" transform="rotate(290)"/>
          <path d="M0,-28 C-6,-15 6,-15 0,0" fill="#fde047" transform="rotate(335)"/>
        </g>
      </svg>
    </div>

    <!-- Primer Botón: Junto a la flor -->
    <button class="btn-flower" id="btnFlower">
      <span>🌻 Lanzar Flores</span>
    </button>

    <!-- Frase Romántica Exacta -->
    <p class="message">
      "No te pude dar tus flores en persona, pero estas son únicas para ti bbsita preciosa, te quiero mucho"
    </p>

    <!-- Segundo Botón: Parte inferior de la tarjeta -->
    <button class="btn-more" id="btnMore">
      ¡Más Flores Amarillas! ✨
    </button>

    <!-- Firma a la derecha inferior -->
    <div class="signature-container">
      <span class="signature">Eduardo G</span>
    </div>
  </main>

  <script>
    // Configuración del Canvas para la lluvia de flores
    const canvas = document.getElementById('flowerCanvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const items = [];
    const colors = ['#fef08a', '#facc15', '#eab308', '#fde047', '#f59e0b'];

    class FlowerItem {
      constructor(isBurst = false, originX = null, originY = null) {
        this.reset(isBurst, originX, originY);
      }

      reset(isBurst = false, originX = null, originY = null) {
        this.x = originX !== null ? originX : Math.random() * width;
        this.y = originY !== null ? originY : -30;
        this.size = Math.random() * 12 + 10;
        this.speedY = isBurst ? (Math.random() - 0.5) * 8 : Math.random() * 2 + 1.2;
        this.speedX = isBurst ? (Math.random() - 0.5) * 8 : Math.sin(Math.random() * Math.PI) * 1.5;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.05;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.isFlower = Math.random() > 0.4; // 60% flores, 40% pétalos
        this.opacity = Math.random() * 0.5 + 0.5;
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX + Math.sin(this.y * 0.01) * 0.5;
        this.rotation += this.rotationSpeed;

        if (this.y > height + 40 || this.x < -40 || this.x > width + 40) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.opacity;

        if (this.isFlower) {
          // Dibujar Flor Amarilla pequeña
          ctx.fillStyle = this.color;
          const petals = 6;
          for (let i = 0; i < petals; i++) {
            ctx.beginPath();
            ctx.rotate((Math.PI * 2) / petals);
            ctx.ellipse(0, this.size * 0.6, this.size * 0.3, this.size * 0.6, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle = '#713f12';
          ctx.beginPath();
          ctx.arc(0, 0, this.size * 0.35, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Dibujar Pétalo
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.ellipse(0, 0, this.size * 0.4, this.size * 0.8, Math.PI / 4, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    }

    // Generar flores iniciales
    for (let i = 0; i < 35; i++) {
      const item = new FlowerItem();
      item.y = Math.random() * height; // Distribuidas por la pantalla al inicio
      items.push(item);
    }

    function spawnBurst(x, y, count = 25) {
      for (let i = 0; i < count; i++) {
        items.push(new FlowerItem(true, x, y));
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      items.forEach(item => {
        item.update();
        item.draw();
      });
      requestAnimationFrame(animate);
    }

    animate();

    // Eventos de interactividad para los botones
    const btnFlower = document.getElementById('btnFlower');
    const btnMore = document.getElementById('btnMore');
    const centerFlower = document.getElementById('centerFlower');

    btnFlower.addEventListener('click', (e) => {
      const rect = btnFlower.getBoundingClientRect();
      spawnBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 20);
    });

    btnMore.addEventListener('click', (e) => {
      const rect = btnMore.getBoundingClientRect();
      spawnBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 30);
    });

    centerFlower.addEventListener('click', (e) => {
      const rect = centerFlower.getBoundingClientRect();
      spawnBurst(rect.left + rect.width / 2, rect.top + rect.height / 2, 25);
    });
  </script>
</body>
</html>
