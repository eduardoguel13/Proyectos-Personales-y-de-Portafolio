<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños Yoss!</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #fce4ec;
            color: #d81b60;
            overflow: hidden;
            text-align: center;
        }

        .card-container {
            width: 100vw;
            height: calc(100vw * 16 / 9);
            max-height: 100vh;
            max-width: calc(100vh * 9 / 16);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .message-box {
            z-index: 10;
        }

        h1 {
            font-size: 2.5em;
            margin: 0;
            animation: bounce 1s infinite;
        }

        .emoji {
            font-size: 1.5em;
            margin-top: 10px;
            animation: pulse 2s infinite;
        }

        /* Animaciones */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        /* Globos decorativos */
        .balloon {
            position: absolute;
            width: 80px;
            height: 100px;
            background-color: #ff6f61;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            bottom: -150px;
            opacity: 0.8;
            animation: float-up 10s infinite;
        }
        
        .balloon::before {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            top: 10px;
            left: 20px;
        }

        .balloon.blue {
            background-color: #59c3c3;
            left: 10%;
            animation-duration: 12s;
            animation-delay: 1s;
        }
        
        .balloon.pink {
            background-color: #ff9a8b;
            left: 40%;
            animation-duration: 9s;
            animation-delay: 3s;
        }

        .balloon.green {
            background-color: #a8d582;
            right: 15%;
            animation-duration: 11s;
            animation-delay: 5s;
        }

        @keyframes float-up {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-120vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="message-box">
            <h1>¡Feliz Cumpleaños Yoss!</h1>
            <p class="emoji">🎉🎂&#10084;&#65039;
</p>
        </div>
        
        <div class="balloon blue"></div>
        <div class="balloon pink"></div>
        <div class="balloon green"></div>
    </div>
</body>
</html>
